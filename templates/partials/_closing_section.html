<section class="closing-section closing-fade">
    <div class="closing-container">
        <h2 class="closing-hero-text">Empowering Health, Securing Lives.</h2>
        <blockquote class="closing-quote">
            "Redefining the standard of safety through the lens of innovation."
        </blockquote>
        <p class="closing-thank-you">Thank you for visiting City General Hospital.</p>
    </div>
</section>

<script>
    // Modular Animation Script: Ensures the fade-in works on every page
    // regardless of the page's own JavaScript environment.
    document.addEventListener('DOMContentLoaded', () => {
        const closingSection = document.querySelector('.closing-fade');
        if (closingSection) {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('is-visible');
                    }
                });
            }, { threshold: 0.15, rootMargin: "0px 0px -50px 0px" });
            observer.observe(closingSection);
        }
    });
</script>
